components:
  schemas:
    AttendanceSerializers:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        attenders_id:
          type: string
          maxLength: 100
        course_id:
          type: string
          writeOnly: true
          maxLength: 100
        course:
          allOf:
          - $ref: '#/components/schemas/CourseSerializers'
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
      required:
      - attenders_id
      - course
      - course_id
      - date_created
      - date_updated
      - id
    CourseSerializers:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course_code:
          type: string
          maxLength: 100
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
      required:
      - course_code
      - date_created
      - date_updated
      - id
    PatchedAttendanceSerializers:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        attenders_id:
          type: string
          maxLength: 100
        course_id:
          type: string
          writeOnly: true
          maxLength: 100
        course:
          allOf:
          - $ref: '#/components/schemas/CourseSerializers'
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
    PatchedCourseSerializers:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course_code:
          type: string
          maxLength: 100
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
    PatchedUserSerializers:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 15
        courses:
          type: string
          maxLength: 100
        occupation:
          type: string
          maxLength: 50
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
    StudentLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 68
          minLength: 8
        tokens:
          type: string
          readOnly: true
      required:
      - email
      - password
      - tokens
    StudentLogout:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    StudentProfile:
      type: object
      properties:
        student:
          type: string
        matric_no:
          type: string
          maxLength: 100
        faculty:
          type: string
          maxLength: 300
        department:
          type: string
          maxLength: 300
        level:
          type: integer
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_updated:
          type: string
          format: date-time
          readOnly: true
          title: Date_created
      required:
      - date_created
      - date_updated
      - department
      - faculty
      - level
      - matric_no
      - student
    StudentRegister:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 300
        phone_no:
          type: string
          maxLength: 15
        role:
          type: string
          maxLength: 30
        is_active:
          type: boolean
          readOnly: true
        password:
          type: string
          writeOnly: true
          maxLength: 68
          minLength: 8
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_updated:
          type: string
          readOnly: true
      required:
      - date_created
      - date_updated
      - email
      - full_name
      - id
      - is_active
      - password
      - phone_no
      - role
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserActivation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
      required:
      - email
      - id
      - is_active
    UserSerializers:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 15
        courses:
          type: string
          maxLength: 100
        occupation:
          type: string
          maxLength: 50
        date_created:
          type: string
          format: date
          readOnly: true
        date_updated:
          type: string
          format: date
          readOnly: true
          title: Date_created
      required:
      - courses
      - date_created
      - date_updated
      - email
      - first_name
      - id
      - last_name
      - occupation
      - phone_number
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
